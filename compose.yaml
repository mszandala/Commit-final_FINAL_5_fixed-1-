# AI Control Layer: security layer (OpenAI-compatible proxy + dashboard) and demonstration application.
#
#   docker compose up -d --build        # UI: http://127.0.0.1:8080, API/proxy: http://127.0.0.1:8000
#   (busy ports: API_PORT=18000 UI_PORT=18080 docker compose up -d --build)
#   docker compose run --rm tests       # automated tests (keyless, runs against model mock)
#
# Model provider key (OPENROUTER_API_KEY) is read from backend/.env or the shell environment.
# Policy (policy/policy.yaml) is mounted read-only: edit on host to take effect on next request.

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  # Executes code from the run_python tool isolated from backend: no network, no data, resource limits.
  # Backend connects via Unix domain socket in a shared volume.
  executor:
    build:
      context: .
      dockerfile: Dockerfile.executor
    image: ai-control-layer-executor:local
    <<: *hardening
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    volumes:
      - executor-socket:/run/executor
    pids_limit: 32
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-control-layer-backend:local
    <<: *hardening
    env_file:
      - path: backend/.env
        required: false
    environment:
      API_HOST: 0.0.0.0                       # overrides API_HOST=127.0.0.1 from backend/.env (otherwise the port is unreachable)
      API_PORT: "8000"
      HF_HUB_OFFLINE: "1"                     # PII and refusal models are baked into image
      PYTHON_EXECUTOR_SOCKET: /run/executor/executor.sock   # run_python executes in separate container
      CORS_ORIGINS: "http://127.0.0.1:${UI_PORT:-8080},http://localhost:${UI_PORT:-8080}"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"    # localhost only; public access requires HTTPS and auth
    volumes:
      - ./backend/data:/repo/backend/data:ro  # tool data: read-only
      - ./policy:/repo/policy:ro              # single configuration source, edited on host
      - state:/state                          # audit log, conversation/spending databases, UI overrides
      - executor-socket:/run/executor
    depends_on:
      executor:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    pids_limit: 256
    mem_limit: 4g
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ai-control-layer-frontend:local
    <<: *hardening
    ports:
      - "127.0.0.1:${UI_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    pids_limit: 64
    mem_limit: 256m
    restart: unless-stopped

  # Tests service: docker compose run --rm tests
  tests:
    profiles: ["tests"]
    image: ai-control-layer-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    <<: *hardening
    working_dir: /repo/backend
    command: ["python", "-m", "pytest", "tests", "-q", "-p", "no:cacheprovider"]
    environment:
      HF_HUB_OFFLINE: "1"
      STATE_DIR: ""
      POLICY_OVERRIDES_FILE: ""
      COMPANY_POLICIES_AUDIT_LOG: /tmp/company_policies_audit.jsonl
      OPENROUTER_API_KEY: "sk-or-test-not-a-real-key"     # tests use mock client and offline evaluation
    volumes:
      - ./backend/data:/repo/backend/data:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
    mem_limit: 4g

volumes:
  state:
  executor-socket:

