# =====================================================================================
#  AI Control Layer Security Policy — Single Source of Configuration
# =====================================================================================
#
#  * The file is hot-reloaded: saving changes takes effect on the next request
#    (without restart). An invalid file does not stop the server — the last valid
#    version remains active, and any parse errors are reported in GET /api/v1/policy.
#  * Unknown keys are rejected to prevent typos from silently disabling guardrails.
#  * Removing a control section does NOT disable it — it defaults to enabled.
#    To disable a control, set `enabled: false` explicitly.
#  * Changes made via the UI (toggles) do not overwrite this file: they are saved to
#    policy.overrides.json alongside it. "Reset" in the UI removes overrides and
#    reverts to the base policy file.
#
#  Precedence order: base file -> active profile (`profile`) -> UI overrides.
# =====================================================================================

version: 1

# Active strictness profile: strict | balanced | permissive (definitions below under `profiles`).
# `balanced` uses the default base values in this file.
profile: balanced

# -------------------------------------------------------------------------------------
#  Strictness profiles — only override listed sections (`controls` and `budgets`).
# -------------------------------------------------------------------------------------
profiles:
  # High-risk environment: short prompts, any doubt blocks, low budget.
  strict:
    controls:
      prompt_length: {max_chars: 2000}
      prompt_guard: {mode: block}
      company_policies:
        strict_keywords: true      # keywords in response/tool result block immediately
        semantic_blocks: true      # topic classification alone blocks
        fail_closed: true          # classifier unavailable = block
      pii: {threshold: 0.20}       # lower threshold = catches more PII
    budgets:
      per_turn: {max_cost_usd: 0.02, max_tool_steps: 6}
      spending_limit_usd: 0.25

  # Default balanced baseline (empty profile = no overrides).
  balanced: {}

  # Development environment: warns instead of blocking, higher resource limits.
  permissive:
    controls:
      prompt_length: {max_chars: 8000}
      prompt_guard: {mode: warn}   # warns and allows through
      pii: {threshold: 0.50}       # higher threshold = fewer false positives
    budgets:
      per_turn: {max_cost_usd: 0.20, max_tool_steps: 15}
      spending_limit_usd: 2.0

# -------------------------------------------------------------------------------------
#  Controls (guardrails), in order of turn execution pipeline.
#  Deterministic: prompt_length, prompt_guard (patterns), tool_whitelist, code_guard,
#                 output_filter (PII rules), company_policies (markers, patterns, fingerprints).
#  Semantic (AI): intent_classifier, company_policies.classifier, pii.judge_enabled,
#                 refusal_detection (embeddings + judge).
# -------------------------------------------------------------------------------------
controls:
  prompt_length:
    enabled: true
    max_chars: 4000            # prompts exceeding this limit are rejected before reaching any model

  prompt_guard:
    enabled: true
    mode: block                # block = rejects request; warn = warns and permits
                               # (applies to intent classifier as well)

  intent_classifier:           # LLM: classifies whether prompt fits role scope
    enabled: true

  company_policies:            # company policies: prompt, tool args, results, reply
    enabled: true
    classifier: security       # security = security zone model; policy = from rules.txt header
    strict_keywords: false     # false: keyword in result/reply warns only
    semantic_blocks: false     # false: semantic topic match without hard proof warns only
    fail_closed: false         # false: unavailable classifier = warning + rule execution only

  tool_whitelist:              # allowed tools per role (defined in `roles` section)
    enabled: true

  code_guard:                  # static Python code inspection prior to execution
    enabled: true

  output_filter:               # PII redaction/blocking in assistant response by role
    enabled: true

  pii:
    mask_in_chatbot_channel: true   # cloud model receives tokens like <EMAIL_1> instead of raw values
    judge_enabled: true             # LLM judge for entities marked `judge` (names, amounts)
    threshold: 0.35                 # PII detector threshold (0-1); lower = more detections

  refusal_detection:           # detects when chatbot refused the user
    enabled: true
    embeddings_enabled: true
    judge_enabled: true
    model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    threshold: 0.5
    trigger_threshold: 0.35

# -------------------------------------------------------------------------------------
#  Allowed LLM Models
#  Requests to models not on this list are blocked (stage: Model policy).
#  Entries are exact names or wildcard patterns, e.g. "google/gemma-*".
#  Empty list or `enabled: false` means no restrictions.
# -------------------------------------------------------------------------------------
models:
  enabled: true
  allowed:
    - google/gemma-4-26b-a4b-it
    - google/gemma-4-26b-a4b-it:free
    - gemma4:12b

# -------------------------------------------------------------------------------------
#  OpenAI-compatible proxy: POST /v1/chat/completions
#  Clients configure base_url (e.g. http://127.0.0.1:8000/v1) and API key; role is derived from key.
# -------------------------------------------------------------------------------------
proxy:
  default_model: ""          # empty = deployment model; client may specify any allowed model
  max_reasks: 2              # times proxy re-prompts model after a rejected tool call
  session_ttl_seconds: 3600  # seconds of inactivity before session state (masked values vault) is evicted
  max_sessions: 1000
  max_body_bytes: 1048576
  max_messages: 200

# Proxy clients: name, role, and SHA-256 hash of API key (plain keys are not stored).
# Key hash command: python -m proxy hash-key <key>
# NOTE: these demo keys are for local demonstration only.
clients:
  - {name: demo-basic, role: "podstawowy użytkownik", key_sha256: 3761ff74ef290916d9cc795731cd8b50d04fcaf6df2c97d20aa76fda9181b17b}
  - {name: demo-hr, role: kadry, key_sha256: df4fe706ff5796d86968d559bba341f2f362e54dcbb68cb967aa3058ed7e2561}
  - {name: demo-banker, role: bankier, key_sha256: f7057ea606c248b33582a310d6d8f1f6d3e78f32478179a3af4f653f861f8c6e}
  - {name: demo-admin, role: administrator, key_sha256: a1304128f87ba7aa357d7fe938db628cccb9ad9465ba832773a604aed2cfd54e}

# -------------------------------------------------------------------------------------
#  Budgets and resources
#  (daily token budget per role: `daily_tokens` in `roles` section)
# -------------------------------------------------------------------------------------
budgets:
  per_turn:                    # limits per turn; further tools are blocked when exceeded
    max_tokens: 40000
    max_cost_usd: 0.05
    max_tool_steps: 10
    max_tool_result_chars: 24000   # results exceeding this are truncated
  spending_limit_usd: 0.5      # cumulative spending limit per role (does not reset daily)

# -------------------------------------------------------------------------------------
#  Sensitive data (PII)
#  Actions: allow | redact | block
#           judge (chatbot channel only: decided by LLM judge) | pseudonymize (identifiers)
# -------------------------------------------------------------------------------------
pii:
  # Global rules: apply to all roles; role policies can only make them stricter.
  global_blocked: [PASSWORD, CREDIT-CARD-NO]
  global_redacted: [EMAIL, PHONE-NO]


  # What the cloud model can see from user prompts and tool results (uniform for all roles).
  chatbot_policy:
    PASSWORD: redact
    EMAIL: redact
    PHONE-NO: redact
    CREDIT-CARD-NO: redact
    CLIENT-ID: redact
    ACCOUNT-NO: redact
    EMPLOYEE-ID: redact
    PESEL: redact
    NAME: judge
    SALARY: judge
    ORGANIZATION: allow
    LOCATION: allow
    PROJECT: allow

  # Baseline user channel policy; entity types omitted here are redacted by default.
  default_role_policy:
    NAME: redact
    SALARY: redact
    PESEL: redact
    ORGANIZATION: allow
    LOCATION: allow
    PROJECT: allow
    CLIENT-ID: allow
    ACCOUNT-NO: allow
    EMPLOYEE-ID: allow

  # Types converted to consistent HMAC pseudonyms instead of sequential numbered placeholders.
  id_types: [CLIENT-ID, ACCOUNT-NO, EMPLOYEE-ID]

# -------------------------------------------------------------------------------------
#  Tools: how to process tool output before passing back to the model.
#  scan: columns (CSV column policy) | regex (rules only) | full (rules + GLiNER) | none
#  public: public source — values in result are not considered PII in replies
#  chatbot_zone: arguments returned to model in cloud — do not unmask
#  Tools not listed default to `tool_defaults.scan`.
# -------------------------------------------------------------------------------------
tool_defaults:
  scan: full

tools:
  read_client_records:
    scan: columns
    column_types: {customer_id: CLIENT-ID, account_number: ACCOUNT-NO, estimated_salary: SALARY}
  read_employee_records:
    scan: columns
    column_types:
      EmployeeNumber: EMPLOYEE-ID
      MonthlyIncome: SALARY
      MonthlyRate: SALARY
      DailyRate: SALARY
      HourlyRate: SALARY
  summarize_client_records: {scan: none}
  summarize_employee_records: {scan: none}
  read_bank_campaigns: {scan: none, public: true}
  read_stock_prices: {scan: none, public: true}
  list_projects: {scan: none, public: true}
  list_earnings_calls: {scan: none, public: true}
  read_project: {scan: regex, public: true}
  read_earnings_call: {scan: regex, public: true}
  create_subagent: {scan: none, chatbot_zone: true}

# Data areas (presented to model and role matrix in place of internal tool names).
areas:
  projects: {label: Projects, tools: [list_projects, read_project]}
  hr: {label: HR data, tools: [read_employee_records, summarize_employee_records]}
  clients: {label: Bank clients, tools: [read_client_records, summarize_client_records]}
  campaigns: {label: Campaigns, tools: [read_bank_campaigns]}
  stocks: {label: Stock prices, tools: [read_stock_prices]}
  earnings: {label: Earnings calls, tools: [list_earnings_calls, read_earnings_call]}
  code: {label: Run code, tools: [run_python]}
  subagents: {label: Subagents, tools: [create_subagent]}

# Data resource -> tools reading it (prompt guard evaluates role access based on this).
resources:
  employee_data: [read_employee_records, summarize_employee_records]
  client_data: [read_client_records, summarize_client_records]
  bank_campaigns: [read_bank_campaigns]
  stock_prices: [read_stock_prices]
  earnings_calls: [list_earnings_calls, read_earnings_call]

# -------------------------------------------------------------------------------------
#  Roles: allowed tools, visible PII types, and daily token budgets.
#  Role order = display order in the UI (from lowest privilege).
# -------------------------------------------------------------------------------------
roles:
  "podstawowy użytkownik":
    id: basic_user
    description: "Standard employee without elevated permissions; accesses general project knowledge."
    allowed_tools: [list_projects, read_project]
    allowed_pii: [PROJECT, ORGANIZATION]
    daily_tokens: 20000

  "kadry":
    id: hr
    description: "HR department (Dział kadr); works with employee records: positions, compensation, performance, attrition."
    allowed_tools: [list_projects, read_project, read_employee_records, summarize_employee_records]
    allowed_pii: [SALARY, PROJECT, ORGANIZATION]
    daily_tokens: 50000

  "bankier":
    id: banker
    description: "Bank relationship advisor; manages bank client accounts and deposit marketing campaigns."
    allowed_tools:
      - list_projects
      - read_project
      - read_client_records
      - summarize_client_records
      - read_bank_campaigns
    allowed_pii: [SALARY, LOCATION, PROJECT, ORGANIZATION]
    daily_tokens: 50000

  "analityk":
    id: analyst
    description: "Data analyst; works on marketing campaigns, pseudonymized client records, and market data."
    allowed_tools:
      - list_projects
      - read_project
      - read_client_records
      - summarize_client_records
      - read_bank_campaigns
      - read_stock_prices
      - list_earnings_calls
      - read_earnings_call
      - create_subagent
    allowed_pii: [SALARY, ORGANIZATION, LOCATION, PROJECT]
    # Sees client records, but identifiers are kept as stable pseudonyms.
    pii_policy: {CLIENT-ID: pseudonymize, ACCOUNT-NO: pseudonymize, EMPLOYEE-ID: pseudonymize}
    daily_tokens: 100000

  "prawnik":
    id: lawyer
    description: "Legal counsel; analyzes public disclosures and quarterly earnings calls."
    allowed_tools: [list_projects, read_project, list_earnings_calls, read_earnings_call]
    allowed_pii: [ORGANIZATION, NAME, LOCATION, PROJECT]
    daily_tokens: 50000

  "Portfolio Manager":
    id: portfolio_manager
    description: "Portfolio manager; analyzes stock performance and public corporate earnings calls."
    allowed_tools:
      - list_projects
      - read_project
      - read_stock_prices
      - list_earnings_calls
      - read_earnings_call
    allowed_pii: [SALARY, ORGANIZATION, NAME, LOCATION, PROJECT]
    daily_tokens: 100000

  "IT":
    id: it
    description: "IT engineering; utilizes technical project documentation and code tools."
    allowed_tools: [list_projects, read_project, create_subagent]
    allowed_pii: [PROJECT, ORGANIZATION]
    daily_tokens: 50000

  "administrator":
    id: admin
    description: "System administrator with full access to all tools and company data."
    allowed_tools:
      - list_projects
      - read_project
      - read_employee_records
      - summarize_employee_records
      - read_client_records
      - summarize_client_records
      - read_bank_campaigns
      - read_stock_prices
      - list_earnings_calls
      - read_earnings_call
      - run_python
      - list_files
      - read_file
      - create_subagent
    allowed_pii: [NAME, SALARY, ORGANIZATION, LOCATION, PROJECT]
    daily_tokens: 200000

