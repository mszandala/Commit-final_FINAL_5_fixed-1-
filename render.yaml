# Wdrożenie na Render (Blueprint): New > Blueprint > adres repozytorium, gałąź dev.
# Backend: obraz z Dockerfile (bez danych giełdowych), frontend: statyczna strona z buildu Vite.
# Nazwy usług wyznaczają adresy (ai-control-layer-api.onrender.com, ai-control-layer-ui.onrender.com). Jeśli Render
# nada inne (nazwa zajęta), popraw VITE_API_URL i CORS_ORIGINS w panelu i wdróż ponownie.
services:
  - type: web
    name: ai-control-layer-api
    runtime: docker
    branch: dev
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: pro                          # backend zużywa ok. 1,8 GB RAM (modele PII i wykrywania odmów)
    healthCheckPath: /api/v1/health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false                    # wpisz w panelu; nie trafia do repozytorium
      - key: API_PORT
        value: "10000"                 # domyślny port Rendera
      - key: CORS_ORIGINS
        value: https://ai-control-layer-ui.onrender.com

  - type: web
    name: ai-control-layer-ui
    runtime: static
    branch: dev
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://ai-control-layer-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
