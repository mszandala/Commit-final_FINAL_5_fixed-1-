server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API aplikacji i proxy zgodne z OpenAI: ten sam backend. Bez buforowania, bo czat przesyła zdarzenia SSE.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 2m;
    }

    location /v1/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 2m;
    }

    # Aplikacja jednostronicowa: nieznane ścieżki wracają do index.html.
    location / {
        try_files $uri /index.html;
    }
}
